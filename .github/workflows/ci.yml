name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r vendor/retrieval-infra/requirements.txt -r requirements-dev.txt
      - run: echo "HTMLDATE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm example:analysis
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Retrieval package
        working-directory: vendor/retrieval-infra
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm test:python
